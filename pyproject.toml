[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "game-of-international-life"
version = "0.3.0"
description = "A computational laboratory for international relations using cellular automata, emergent states, and matched theory experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Roland Löchli" }
]
keywords = [
  "cellular-automata",
  "game-of-life",
  "international-relations",
  "computational-social-science",
  "structural-realism",
  "agent-based-modeling",
  "complex-systems",
  "evolutionary-computation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.9",
]

[project.scripts]
international-life = "international_life.cli:main"

[project.urls]
Repository = "https://github.com/ReloadLightly/game-of-international-life"
Documentation = "https://github.com/ReloadLightly/game-of-international-life/tree/main/docs"
Issues = "https://github.com/ReloadLightly/game-of-international-life/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
